<article [class.owned]="owned()"><div class="score" [attr.data-tier]="pokemon().tier"><b>{{pokemon().tier}}</b><small>{{pokemon().score}}/100</small></div><img [src]="pokemon().sprite" [alt]="pokemon().name" loading="lazy"><div class="body"><h3>{{pokemon().name}}</h3><div class="types">@for(type of pokemon().types;track type){<span class="type" [attr.data-type]="type">{{type}}</span>}@empty{<span class="skeleton">Caricamento tipi…</span>}</div><p>{{pokemon().role}}</p><button type="button" (click)="toggle.emit(pokemon())">{{owned()?'Rimuovi dal Box':'Aggiungi al Box'}}</button></div></article>
