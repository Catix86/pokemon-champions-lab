<header><span>Archivio</span><h1>Squadre salvate</h1><p>{{store.cloudReady()?'Sincronizzazione Firestore attiva':'Modalità locale. Configura Firebase per la sincronizzazione cloud.'}}</p></header><div class="tabs"><button [class.active]="tab()==='singolo'" (click)="tab.set('singolo')">Lotta in Singolo</button><button [class.active]="tab()==='doppio'" (click)="tab.set('doppio')">Lotta in Doppio</button></div><div class="list">@for(team of teams();track team.id){<app-team-view [team]="team" [removable]="true" (remove)="store.removeTeam($event)"/>}@empty{<div class="empty"><b>Nessuna squadra salvata</b><p>Generane una nel Team Builder.</p></div>}</div>
